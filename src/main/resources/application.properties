# run HTTP server locally
server.address=127.0.0.1
server.port=8080

# indentify MCP server
spring.ai.mcp.server.name=bookshelf-mcp
spring.ai.mcp.server.version=1.0.0

# communicate using streamable HTTP
spring.ai.mcp.server.protocol=STREAMABLE

# Ref: https://docs.spring.io/spring-ai/reference/api/mcp/mcp-streamable-http-server-boot-starter-docs.html#_streamable_http_mcp_servers